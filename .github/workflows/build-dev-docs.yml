name: 📚 Build Development Documentation

on:
  push:
    branches: 
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - boost-doc              # Your current development branch
    paths:
      - 'drafts/current/specifications/**'
      - 'drafts/current/schema/**'
      - '.github/workflows/**'

  # Allow manual triggering for any branch
  workflow_dispatch:
    inputs:
      include_pdf:
        description: 'Generate PDF documentation (may timeout in Docker)'
        required: false
        type: boolean
        default: true

# Allow concurrent builds on different branches
concurrency:
  group: build-dev-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-version:
    name: 🏷️ Extract Version Info (Development)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version-info.outputs.version }}
      build-timestamp: ${{ steps.version-info.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full git history for version extraction
      
      - name: Extract version information
        id: version-info
        run: |
          echo "🔍 Extracting version information for development build..."
          
          # Extract version for development builds
          if git describe --tags >/dev/null 2>&1; then
              VERSION=$(git describe --tags --always)
              echo "📋 Using detailed git version: $VERSION"
          else
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null)
              if [ -z "$VERSION" ]; then
                  SHORT_HASH=$(git rev-parse --short HEAD)
                  VERSION="v0.0.0-dev-${SHORT_HASH}"
                  echo "⚠️ No git tags found, using commit hash: $VERSION"
              else
                  SHORT_HASH=$(git rev-parse --short HEAD)
                  VERSION="${VERSION}-dev-${SHORT_HASH}"
                  echo "📋 Using tagged development version: $VERSION"
              fi
          fi
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BRANCH_NAME="${{ github.ref_name }}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          echo "::notice title=Development Build::Building BOOST Documentation $VERSION on branch $BRANCH_NAME"

  build-dev-documentation:
    name: 📖 Build Documentation (Development)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent stuck dev builds - Docker should be ~2-3 min
    needs: extract-version
    container:
      image: ghcr.io/boost-working-group/boost/boost-builder:latest
      options: --pull=missing
      env:
        RELEASE_VERSION: ${{ needs.extract-version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify containerized environment
        run: |
          echo "🐳 Docker containerized development build environment"
          echo "Python version: $(python3 --version)"
          echo "Bikeshed version: $(bikeshed --version)"
          echo "TeXLive available: $(which pdflatex && echo 'Yes' || echo 'No')"
          echo "Pandoc version: $(pandoc --version | head -1)"

      - name: Confirm version information
        run: |
          echo "🏷️ Using pre-extracted version: ${{ needs.extract-version.outputs.version }}"
          echo "⏰ Build timestamp: ${{ needs.extract-version.outputs.timestamp }}"
          echo "🐳 Container environment variable RELEASE_VERSION: $RELEASE_VERSION"
          
          # Verify the environment variable is set correctly
          if [ "$RELEASE_VERSION" != "${{ needs.extract-version.outputs.version }}" ]; then
              echo "⚠️ Warning: Environment variable mismatch"
              echo "  Pre-extracted: ${{ needs.extract-version.outputs.version }}"
              echo "  Container env:  $RELEASE_VERSION"
          else
              echo "✅ Version successfully passed to Docker container"
          fi
          
          echo "::notice title=Development Build Version::Building BOOST Documentation ${{ needs.extract-version.outputs.version }}"

      - name: Run schema validation
        working-directory: drafts/current/specifications
        run: |
          echo "🔍 Running schema validation..."
          python3 -c "
          import json
          import sys
          from pathlib import Path
          
          schema_dir = Path('../schema')
          errors = []
          validated = 0
          
          for schema_file in schema_dir.rglob('validation_schema.json'):
              try:
                  with open(schema_file, 'r') as f:
                      schema_data = json.load(f)
                  validated += 1
              except Exception as e:
                  errors.append(f'Error in {schema_file}: {e}')
          
          if errors:
              for error in errors:
                  print(f'❌ {error}')
              sys.exit(1)
          
          print(f'✅ Schema validation passed for {validated} schemas')
          "

      - name: Build HTML documentation  
        working-directory: drafts/current/specifications
        run: |
          echo "🏗️ Building HTML documentation with consolidated build system..."
          echo "📋 Branch: ${{ needs.extract-version.outputs.branch }}"
          echo "🔧 Version: ${{ needs.extract-version.outputs.version }}"
          echo "🎯 Build type: Development (no deployment)"
          
          chmod +x build.sh
          ./build.sh --html

      - name: Build PDF documentation
        if: github.event.inputs.include_pdf != 'false'
        working-directory: drafts/current/specifications
        run: |
          echo "📄 Building PDF documentation for development with consolidated build system..."
          echo "⚠️  Note: PDF builds in Docker containers may have resource limitations"
          timeout 300 ./build.sh --pdf || {
            echo "❌ PDF build timed out after 5 minutes - this is expected in resource-constrained environments"
            echo "✅ HTML documentation was built successfully"
            exit 0
          }

      - name: Validate build output
        working-directory: drafts/current/specifications
        run: |
          echo "🔍 Validating development build output..."
          
          # Check HTML
          if [ ! -f "boost-spec.html" ]; then
            echo "❌ HTML documentation not generated"
            exit 1
          fi
          
          HTML_SIZE=$(wc -c < boost-spec.html)
          if [ "$HTML_SIZE" -lt 100000 ]; then
            echo "❌ HTML file too small ($HTML_SIZE bytes)"
            exit 1
          fi
          
          # Check content
          if ! grep -q "BOOST" boost-spec.html; then
            echo "❌ HTML missing BOOST content"
            exit 1
          fi
          
          # Check ERD Navigator
          if [ ! -f "erd-navigator/index.html" ]; then
            echo "⚠️ ERD Navigator not found"
          else
            echo "✅ ERD Navigator present"
          fi
          
          echo "✅ Development build validation passed"
          echo "📊 HTML Size: $(echo $HTML_SIZE | numfmt --to=iec-i --suffix=B)"

      - name: Generate development build report
        working-directory: drafts/current/specifications
        shell: bash
        run: |
          cat > dev-build-report.md << EOF
          # 📚 BOOST Development Build Report
          
          **Branch:** ${{ needs.extract-version.outputs.branch }}
          **Version:** ${{ needs.extract-version.outputs.version }}
          **Build Time:** ${{ needs.extract-version.outputs.timestamp }}
          **Commit:** ${GITHUB_SHA::8}
          **Build Type:** Development (No Deployment)
          
          ## 🏗️ Build Results
          
          - ✅ **HTML Documentation:** $(wc -c < boost-spec.html | numfmt --to=iec-i --suffix=B)
          - $([ -f "build/boost-spec.pdf" ] && echo "✅ **PDF Documentation:** $(wc -c < build/boost-spec.pdf | numfmt --to=iec-i --suffix=B)" || echo "⚠️ **PDF Documentation:** Not generated (disabled by default for faster development builds)")
          - ✅ **ERD Navigator:** Interactive tool included
          - ✅ **Schema Files:** $(find ../schema -name "validation_schema.json" | wc -l) validated schemas
          
          ## 📋 Development Notes
          
          This is a development build from the **${{ needs.extract-version.outputs.branch }}** branch.
          - No deployment to GitHub Pages
          - Artifacts retained for 7 days
          - PDF optimized for development review
          
          ## 🔗 Next Steps
          
          - Review documentation changes
          - Test ERD Navigator functionality  
          - Validate schema modifications
          - Create PR to main branch for production deployment
          
          ---
          
          💡 **Tip:** Use the artifacts below to download and review the complete documentation package.
          EOF
          
          echo "📋 Development Build Report:"
          cat dev-build-report.md

      - name: Upload development build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boost-dev-docs-${{ needs.extract-version.outputs.branch }}-${{ github.run_number }}
          path: |
            drafts/current/specifications/boost-spec.html
            drafts/current/specifications/build/boost-spec.pdf
            drafts/current/specifications/dev-build-report.md
            drafts/current/specifications/erd-navigator/
            drafts/current/schema/
            drafts/current/specifications/respec-style.css
          retention-days: 7

      - name: Development build summary
        run: |
          echo "## 🎉 Development Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ needs.extract-version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.extract-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ needs.extract-version.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 HTML Documentation with ReSpec styling" >> $GITHUB_STEP_SUMMARY
          echo "- $([ -f "drafts/current/specifications/build/boost-spec.pdf" ] && echo "📋 PDF Documentation for offline review" || echo "⚠️ PDF generation disabled by default for faster builds")" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Interactive ERD Navigator" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 All schema validation files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts to review documentation" >> $GITHUB_STEP_SUMMARY
          echo "2. Test functionality and validate changes" >> $GITHUB_STEP_SUMMARY
          echo "3. Create PR to main branch for production deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 This build does not deploy - it's for development review only!" >> $GITHUB_STEP_SUMMARY